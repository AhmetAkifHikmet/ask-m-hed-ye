  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0813 0%, #4a1223 50%, #6e1a32 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ana Kutu: Ekrandaki zıplamaları ve kaymaları önler */
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 380px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #ff758c;
      font-size: 26px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(255, 117, 140, 0.3);
    }

    p.subtitle {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      margin-bottom: 20px;
    }

    .box-wrapper {
      margin: 15px 0;
    }

    .gift-emoji {
      font-size: 75px;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.3s ease;
      user-select: none;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.3));
    }

    .gift-emoji:hover {
      transform: scale(1.15) rotate(5deg);
    }

    .note-card {
      width: 100%;
      min-height: 220px;
      margin-top: 20px;
      padding: 15px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px dashed rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      visibility: hidden;
    }

    .note-card.show {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }

    .note-text {
      color: #ffffff;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* Sürpriz Görsel */
    .surprise-image {
      width: 100%;
      max-width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
      display: none;
    }

    .btn {
      background: linear-gradient(45deg, #ff758c, #ff7eb3);
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 117, 140, 0.6);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* Gizli Buton Stili */
    .gizli-btn {
      display: none;
      background: linear-gradient(45deg, #f093fb, #f5576c);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.8);
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 0 15px rgba(245, 87, 108, 0.6);
      animation: pulseAnim 1.5s infinite alternate;
    }

    @keyframes pulseAnim {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(245, 87, 108, 0.5); }
      100% { transform: scale(1.05); box-shadow: 0 0 20px rgba(245, 87, 108, 0.9); }
    }

    .floating-element {
      position: absolute;
      bottom: -50px;
      pointer-events: none;
      animation: floatUpContinuous 6s linear infinite;
      z-index: 1;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
    }

    @keyframes floatUpContinuous {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.9;
      }
      90% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(360deg) scale(1.3);
        opacity: 0;
      }
    }
  </style>
</head>

      const noteCard = document.getElementById("noteCard");
      const noteText = document.getElementById("noteText");
      const surpriseImg = document.getElementById("surpriseImg");
      const giftBox = document.getElementById("giftBox");

      giftBox.style.transform = "scale(1.3) rotate(-10deg)";
      setTimeout(() => {
        giftBox.style.transform = "scale(1) rotate(0deg)";
      }, 200);

      noteCard.classList.remove("show");

      setTimeout(() => {
        let secim;
        do {
          secim = Math.floor(Math.random() * 3);
        } while (secim === sonSecimTuru);
        sonSecimTuru = secim;

        if (secim === 0) {
          const yeniNotIndex = Math.floor(Math.random() * notlar.length);
          noteText.textContent = notlar[yeniNotIndex];
          noteText.style.display = "block";
          surpriseImg.style.display = "none";
        } 
        else if (secim === 1) {
          const yeniKediIndex = Math.floor(Math.random() * kedilerResimleri.length);
          noteText.textContent = "Günün Kedisi! 🐾";
          noteText.style.display = "block";
          surpriseImg.src = encodeURIComponent(kedilerResimleri[yeniKediIndex]).replace(/%2F/g, "/");          
          surpriseImg.style.display = "block";
        } 
        else {
          const yeniBizIndex = Math.floor(Math.random() * bizResimleri.length);
          noteText.textContent = "En Güzel Anılarımızdan Biri... 📸💖";
          noteText.style.display = "block";
          surpriseImg.src = encodeURIComponent(bizResimleri[yeniBizIndex]).replace(/%2F/g, "/");
          surpriseImg.style.display = "block";
        }

        noteCard.classList.add("show");
      }, 250);
    }

    // Gizli Mesaj Fonksiyonu
    function gizliMesajiGoster() {
      const noteCard = document.getElementById("noteCard");
      const noteText = document.getElementById("noteText");
      const surpriseImg = document.getElementById("surpriseImg");

      noteCard.classList.remove("show");

      setTimeout(() => {
        noteText.textContent = "Gizli mesaj.....Aşkım sen başıma gelmiş en güzel olaysın iyiki benden önce bize ilk adımı(sürpriz yumurta gibi girdin hayatıma) sen attın senin çabalaman bana umut sevgi ve en önemlisi bana değer verilmiş hissi veriyor seni mutlu etmek için elimden geleni yapıcam çok ters bi zamanda tanışmamıza rağmen beni kırmayıp sevmediğin şeyler yaparak bana ayak uydurduğnu biliyorum ilk defa biri tarafından anlaşılmış değer verilmiş hissediyorum ve bu beni ağlatacak derecede mutlu ediyor bende aynısını senin için yapmaya çalışıyorum seni kalbimden bir parça olarak görüyorum bu zamanlarda geçicek hep birbirimizin yanında olucaz  seni sonsuza kadar seveceğim allah nasip ederse gelecekte hep seninle yan yana olmak seninle evlenmek istiyorum iyi varsın iyiki sevgiliyiz seni çoook seviyorum ve sevmeye devam edeceğim Doğum gününn kutlu olsun kalbimin sahibi ❤️✨";
        noteText.style.display = "block";
        surpriseImg.style.display = "none";
        noteCard.classList.add("show");
      }, 250);
    }

    // Arka Plan Uçuşan Emojiler
    const emojiler = ['😽', '❤️‍🔥', '❤️', '💙', '✨', '💖', '💕']; 

    function emojiOlustur() {
      const element = document.createElement('div');
      element.classList.add('floating-element');
      
      const rastgeleEmoji = emojiler[Math.floor(Math.random() * emojiler.length)];
      element.innerHTML = rastgeleEmoji;

      element.style.left = Math.random() * 100 + 'vw';

      const rastgeleBoyut = Math.random() * 20 + 33;
      element.style.fontSize = rastgeleBoyut + 'px';

      const rastgeleSüre = Math.random() * 3 + 4;
      element.style.animationDuration = rastgeleSüre + 's';

      document.body.appendChild(element);

      setTimeout(() => {
        element.remove();
      }, rastgeleSüre * 1000);
    }

    setInterval(emojiOlustur, 200);
  </script>
